plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 34
    
    defaultConfig {
        applicationId "com.example.proscan" // 可选：修改应用包名
        minSdkVersion 30  // 最低支持 Android 11
        targetSdkVersion 34
        versionCode 28
        versionName "3.0"  // 版本更新
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            // 签名信息通过环境变量或 gradle.properties 传入，避免密码写进代码库
            // 注意：路径相对于项目根目录解析（rootProject.file），例如 key/default
            // 例如：
            //   ./gradlew assembleRelease \
            //     -PPROSCAN_STORE_FILE=key/default \
            //     -PPROSCAN_STORE_PASSWORD=... -PPROSCAN_KEY_ALIAS=... -PPROSCAN_KEY_PASSWORD=...
            def storePath = System.getenv("PROSCAN_STORE_FILE") ?: (project.findProperty("PROSCAN_STORE_FILE") ?: "your_keystore.jks")
            storeFile rootProject.file(storePath)
            storePassword System.getenv("PROSCAN_STORE_PASSWORD") ?: (project.findProperty("PROSCAN_STORE_PASSWORD") ?: "")
            keyAlias System.getenv("PROSCAN_KEY_ALIAS") ?: (project.findProperty("PROSCAN_KEY_ALIAS") ?: "")
            keyPassword System.getenv("PROSCAN_KEY_PASSWORD") ?: (project.findProperty("PROSCAN_KEY_PASSWORD") ?: "")
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    namespace 'com.example.proscan'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ML Kit Barcode Scanning 独立版本（不需要 Google Play Services，模型打包在应用中）
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // ZXing-CPP Android 封装（官方维护，含 JNI .so，支持 YUV/Bitmap 直接解码）
    implementation 'io.github.zxing-cpp:android:2.3.0'

    // ZXing core（仅用于生成二维码/条形码；识别引擎已改用 ZXing-CPP）
    implementation 'com.google.zxing:core:3.5.2'

    // CameraX（用于相机预览与图像分析）
    // 注：ML Kit 17.3.0 / zxing-cpp 2.3.0 传递依赖会将 CameraX 原子组升级至 1.4.1（要求 compileSdk 34），
    // 因此本项目 compileSdk/targetSdk 已升级到 34
    def camerax_version = "1.2.3"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // 华为 HMS Core Scan Kit 增强版（scanplus，针对曲面/反光/污损/小码优化的 AI 增强算法）
    // 基础版 scan 算法较弱，条码识别场景务必使用 scanplus
    implementation 'com.huawei.hms:scanplus:2.12.0.300'
}

plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 33
    
    defaultConfig {
        applicationId "com.example.proscan" // 可选：修改应用包名
        minSdkVersion 23  // Google Code Scanner 要求最低 API 23
        targetSdkVersion 33
        versionCode 7
        versionName "2.4"  // 版本更新：集成微信 OpenCV 二维码识别（需要模型文件）
    }

    signingConfigs {
        release {
            storeFile file("your_keystore.jks")  // 替换为您的密钥库文件名
            storePassword "your_store_password"   // 替换为您的密钥库密码
            keyAlias "your_key_alias"            // 替换为您的密钥别名
            keyPassword "your_key_password"      // 替换为您的密钥密码
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    namespace 'com.example.proscan'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // 二维码扫描 - ZXing（备用方案）
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.2'
    
    // Google ML Kit Code Scanner（需要 Google Play Services）
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    
    // ML Kit Barcode Scanning 独立版本（不需要 Google Play Services）
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    
    // CameraX（用于 ML Kit 独立版本的相机预览）
    def camerax_version = "1.2.3"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    
    // 华为 HMS Core Scan Kit
    implementation 'com.huawei.hms:scan:2.12.0.300'
    
    // OpenCV（用于微信二维码识别）
    implementation 'org.opencv:opencv:4.9.0'
}